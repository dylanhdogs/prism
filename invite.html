<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Invitation — PRISM</title>
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <div class="auth-page" style="min-height:100vh;">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="/" class="auth-logo">
            <img src="prism_logo_01.png" alt="PRISM" width="40" height="40">
            <span class="auth-logo-text">PRISM</span>
          </a>
          <h1>Guest invitation</h1>
          <p id="invite-status" style="font-size:14px;color:var(--gray-500);">Loading invitation...</p>
        </div>

        <form id="guest-name-form" style="display:none;">
          <div class="form-group">
            <label for="guest-name-input">Your name</label>
            <input type="text" id="guest-name-input" placeholder="Enter your name" maxlength="80" required>
          </div>
          <button class="btn btn-primary btn-full" id="guest-name-btn" type="submit">Enter group</button>
        </form>

        <div id="active-actions" style="display:none;">
          <a href="/guest" class="btn btn-primary btn-full">Open guest view</a>
        </div>

        <div id="invite-error" class="form-error" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createGuestSession, openGuestInvite } from '/src/lib/guest.ts';

    let inviteToken = '';

    function getToken() {
      const params = new URLSearchParams(window.location.search);
      const queryToken = params.get('token');
      if (queryToken) return queryToken;
      return window.location.pathname.split('/invite/').filter(Boolean)[0] || '';
    }

    function showError(message) {
      document.getElementById('invite-error').textContent = message;
      document.getElementById('invite-error').style.display = 'block';
    }

    function showNameForm(data) {
      document.getElementById('invite-status').textContent = `You've been invited to view "${data.groupName || 'a group'}". Enter your name once to create guest access for this group.`;
      document.getElementById('guest-name-form').style.display = 'block';
      document.getElementById('guest-name-input').focus();
    }

    async function init() {
      const statusEl = document.getElementById('invite-status');
      statusEl.innerHTML = '<div class="loading-state"><div class="spinner-lg"></div><span>Checking invite...</span></div>';

      inviteToken = getToken();
      if (!inviteToken) {
        statusEl.textContent = 'Invalid invite link.';
        return;
      }

      try {
        const data = await openGuestInvite(inviteToken);
        if (data.status === 'active') {
          window.location.href = '/guest';
          return;
        }
        if (data.status === 'needs_name') {
          showNameForm(data);
          return;
        }
        statusEl.textContent = 'This invite is no longer available.';
        showError(data.message || 'This invite is invalid, expired, or already claimed.');
      } catch (err) {
        statusEl.textContent = 'This invite is no longer available.';
        showError(err.message || 'This invite is invalid, expired, or already claimed.');
      }
    }

    document.getElementById('guest-name-form')?.addEventListener('submit', async (event) => {
      event.preventDefault();
      const btn = document.getElementById('guest-name-btn');
      const errorEl = document.getElementById('invite-error');
      const guestName = document.getElementById('guest-name-input').value.trim();

      btn.disabled = true;
      btn.classList.add('btn-loading');
      errorEl.style.display = 'none';

      try {
        await createGuestSession(inviteToken, guestName);
        window.location.href = '/guest';
      } catch (err) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        showError(err.message || 'Unable to enter group.');
      }
    });

    init();
  </script>
</body>
</html>
