<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest View — PRISM</title>
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar-logo">
        <img src="prism_logo_01.png" alt="PRISM">
        <span>PRISM</span>
      </div>
      <nav>
        <a class="active">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2l7 5v9H2V7l7-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          Guest View
        </a>
      </nav>
      <div class="sidebar-footer">
        <span style="font-size:12px;color:var(--gray-400);">Guest access</span>
      </div>
    </aside>
    <main class="app-main">
      <header class="app-header">
        <h2 id="group-title">Guest View</h2>
        <div class="app-header-right">
          <span class="user-name" id="guest-name"></span>
        </div>
      </header>
      <div class="app-content">
        <div id="guest-loading" class="loading-state" style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:40px;">
          <div class="spinner-lg"></div>
          <span>Loading guest access...</span>
        </div>
        <div id="guest-error" class="form-error" style="display:none;"></div>
        <div id="guest-content" style="display:none;">
          <div class="group-detail-header">
            <div>
              <h2 id="group-name"></h2>
              <p id="group-meta" style="color:var(--gray-400);font-size:14px;"></p>
            </div>
            <div style="font-size:13px;color:var(--gray-500);font-weight:600;">View only</div>
          </div>

          <div class="balance-summary" id="balance-summary"></div>

          <div class="section-card" style="margin-top:20px;">
            <h3>Members</h3>
            <div id="members-list" class="members-list"></div>
          </div>

          <div class="section-card" style="margin-top:20px;">
            <h3>Expenses</h3>
            <div id="expenses-list" class="expenses-list"></div>
          </div>

          <div class="section-card" style="margin-top:20px;">
            <h3>Settlements</h3>
            <div id="settlements-list"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { getGuestGroup } from '/src/lib/guest.ts';

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function formatDate(value) {
      return new Date(value).toLocaleDateString();
    }

    function calculateBalances(members, expenses) {
      const balances = new Map(members.map((member) => [member.id, { name: member.display_name || 'Unknown', paid: 0, owed: 0, net: 0 }]));

      for (const expense of expenses) {
        const paidById = expense.paid_by?.id;
        if (paidById && balances.has(paidById)) {
          balances.get(paidById).paid += Number(expense.amount || 0);
        }

        for (const split of expense.splits || []) {
          if (balances.has(split.member_id)) {
            balances.get(split.member_id).owed += Number(split.amount_owed || 0);
          }
        }
      }

      return Array.from(balances.values()).map((balance) => ({
        ...balance,
        net: Math.round((balance.paid - balance.owed) * 100) / 100,
      }));
    }

    function renderBalances(members, expenses) {
      const balances = calculateBalances(members, expenses);
      const totalExpenses = expenses.reduce((sum, expense) => sum + Number(expense.amount || 0), 0);
      const unsettled = balances.filter((balance) => balance.net !== 0).length;

      document.getElementById('balance-summary').innerHTML = `
        <div class="balance-card">
          <div class="label">Total expenses</div>
          <div class="value">$${totalExpenses.toFixed(2)}</div>
        </div>
        <div class="balance-card">
          <div class="label">Members</div>
          <div class="value">${members.length}</div>
        </div>
        <div class="balance-card">
          <div class="label">Open balances</div>
          <div class="value">${unsettled}</div>
        </div>
      `;
    }

    function renderMembers(members) {
      const el = document.getElementById('members-list');
      if (!members.length) {
        el.innerHTML = '<p style="color:var(--gray-400);font-size:14px;">No members yet.</p>';
        return;
      }
      el.innerHTML = members.map((member) => `
        <div class="member-row">
          <div class="member-info">
            <div class="member-avatar">${escapeHtml((member.display_name || '?')[0].toUpperCase())}</div>
            <div>
              <div class="member-name">${escapeHtml(member.display_name || 'Unknown')}</div>
              <div class="member-role">${escapeHtml(member.role || 'member')}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderExpenses(expenses) {
      const el = document.getElementById('expenses-list');
      if (!expenses.length) {
        el.innerHTML = '<p style="color:var(--gray-400);font-size:14px;">No expenses yet.</p>';
        return;
      }
      el.innerHTML = expenses.map((expense) => `
        <div class="expense-row">
          <div class="expense-info">
            <span class="expense-title">${escapeHtml(expense.title)}</span>
            <span class="expense-meta">Paid by ${escapeHtml(expense.paid_by?.display_name || 'Unknown')} on ${formatDate(expense.expense_date)}</span>
          </div>
          <div class="expense-amount">$${Number(expense.amount).toFixed(2)}</div>
        </div>
      `).join('');
    }

    function renderSettlements(settlements) {
      const el = document.getElementById('settlements-list');
      if (!settlements.length) {
        el.innerHTML = '<p style="color:var(--gray-400);font-size:14px;">No settlements recorded.</p>';
        return;
      }
      el.innerHTML = settlements.map((settlement) => `
        <div class="settlement-row">
          <span>${escapeHtml(settlement.from_member?.display_name || 'Unknown')} paid ${escapeHtml(settlement.to_member?.display_name || 'Unknown')}</span>
          <span class="amount">$${Number(settlement.amount).toFixed(2)}</span>
        </div>
      `).join('');
    }

    async function init() {
      const loading = document.getElementById('guest-loading');
      const error = document.getElementById('guest-error');
      const content = document.getElementById('guest-content');

      try {
        const data = await getGuestGroup();
        loading.style.display = 'none';
        content.style.display = 'block';

        document.getElementById('group-title').textContent = data.group.name;
        document.getElementById('group-name').textContent = data.group.name;
        document.getElementById('group-meta').textContent = data.group.description || 'Shared expenses group';
        document.getElementById('guest-name').textContent = data.guest.name;

        renderBalances(data.members, data.expenses);
        renderMembers(data.members);
        renderExpenses(data.expenses);
        renderSettlements(data.settlements);
      } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.innerHTML = `${escapeHtml(err.message || 'Guest access expired.')} <a href="/" style="color:inherit;text-decoration:underline;">Return home</a>`;
      }
    }

    init();
  </script>
</body>
</html>
