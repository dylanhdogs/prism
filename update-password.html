<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password — PRISM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <img src="prism_logo_01.png" alt="PRISM" width="40" height="40">
          <span class="auth-logo-text">PRISM</span>
        </a>
        <h1>Set new password</h1>
        <p>Enter your new password below.</p>
      </div>
      <form id="update-password-form" class="auth-form">
        <div class="form-group">
          <label for="password">New password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <div id="update-error" class="form-error" style="display:none"></div>
        <div id="update-success" class="form-success" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full" id="update-btn">Update password</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { updatePassword } from '/src/lib/auth.ts';

    document.getElementById('update-password-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('update-btn');
      const errorEl = document.getElementById('update-error');
      const successEl = document.getElementById('update-success');
      btn.disabled = true; btn.classList.add('btn-loading');
      errorEl.style.display = 'none'; successEl.style.display = 'none';

      const password = document.getElementById('password').value;
      const { error } = await updatePassword(password);

      if (error) {
        errorEl.textContent = error;
        errorEl.style.display = 'block';
        btn.disabled = false; btn.classList.remove('btn-loading');
        return;
      }

      successEl.textContent = 'Password updated successfully!';
      successEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Update password';

      setTimeout(() => { window.location.href = '/dashboard'; }, 2000);
    });
  </script>
</body>
</html>
