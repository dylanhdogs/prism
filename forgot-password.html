<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — PRISM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <img src="prism_logo_01.png" alt="PRISM" width="40" height="40">
          <span class="auth-logo-text">PRISM</span>
        </a>
        <h1>Reset your password</h1>
        <p>Enter your email and we'll send you a reset link.</p>
      </div>
      <form id="forgot-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div id="forgot-error" class="form-error" style="display:none"></div>
        <div id="forgot-success" class="form-success" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full" id="forgot-btn">Send reset link</button>
      </form>
      <p class="auth-footer-text">
        <a href="/login">Back to log in</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { resetPassword } from '/src/lib/auth.ts';

    document.getElementById('forgot-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgot-btn');
      const errorEl = document.getElementById('forgot-error');
      const successEl = document.getElementById('forgot-success');
      if (!btn || !errorEl || !successEl) return;

      btn.disabled = true;
      btn.classList.add('btn-loading');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const email = document.getElementById('email').value;
      const { error } = await resetPassword(email);

      if (error) {
        errorEl.textContent = error;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        return;
      }

      successEl.textContent = 'Check your email for a password reset link.';
      successEl.style.display = 'block';
      btn.disabled = false;
      btn.classList.remove('btn-loading');
    });
  </script>
</body>
</html>
