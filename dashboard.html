<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PRISM</title>
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar-logo">
        <img src="prism_logo_01.png" alt="PRISM">
        <span>PRISM</span>
      </div>
      <nav>
        <a href="/dashboard" class="active">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="10" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="10" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
          Dashboard
        </a>
      </nav>
      <div class="sidebar-footer">
        <a id="logout-btn">Log out</a>
      </div>
    </aside>
    <main class="app-main">
      <header class="app-header">
        <h2>Dashboard</h2>
        <div class="app-header-right">
          <span class="user-name" id="user-name"></span>
        </div>
      </header>
      <div class="app-content">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
          <h3 style="font-size:18px;font-weight:700;color:var(--navy);">Your Groups</h3>
          <button class="btn btn-primary btn-sm" onclick="showCreateGroupModal()">+ New Group</button>
        </div>
        <div id="groups-loading" class="loading-state" style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:40px;">
          <div class="spinner-lg"></div>
          <span>Loading your groups...</span>
        </div>
        <div id="groups-list" class="groups-grid"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
          <h3>No groups yet</h3>
          <p>Create your first group to start tracking shared expenses.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Group Modal -->
  <div id="create-group-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2>Create a new group</h2>
      <form id="create-group-form">
        <div class="form-group">
          <label for="group-name">Group name</label>
          <input type="text" id="group-name" placeholder="e.g. Bali Trip 2026" required>
        </div>
        <div class="form-group">
          <label for="group-desc">Description (optional)</label>
          <input type="text" id="group-desc" placeholder="e.g. Shared expenses for our vacation">
        </div>
        <div id="create-group-error" class="form-error" style="display:none;"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeCreateGroupModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="create-group-btn">Create group</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { getPageAuthState, logOut, onAuthStateChange } from '/src/lib/auth.ts';
    import { getUserGroups, getGroupMembers, createGroup } from '/src/lib/groups.ts';
    import { getProfile } from '/src/lib/database.ts';
    import { calculateGroupBalances } from '/src/lib/balances.ts';

    let currentUserId = '';
    let initialAuthCheck = true;

    async function init() {
      try {
        const auth = await getPageAuthState();
        if (auth.status === 'signed_out') {
          window.location.href = '/login';
          return;
        }
        if (auth.status === 'stale_session') {
          window.location.href = '/login?session=expired';
          return;
        }

        currentUserId = auth.user.id;

        try {
          const profile = await getProfile(auth.user.id);
          document.getElementById('user-name').textContent = profile.full_name || profile.email;
        } catch {
          document.getElementById('user-name').textContent = auth.user.email || 'User';
        }

        await loadGroups();
      } catch (err) {
        const loadingState = document.getElementById('groups-loading');
        if (loadingState) loadingState.style.display = 'none';
        console.error('Dashboard init error:', err);
      } finally {
        initialAuthCheck = false;
      }
    }

    async function loadGroups() {
      const container = document.getElementById('groups-list');
      const emptyState = document.getElementById('empty-state');
      const loadingState = document.getElementById('groups-loading');

      try {
        const groups = await getUserGroups();
        if (loadingState) loadingState.style.display = 'none';
        if (groups.length === 0) {
          container.innerHTML = '';
          emptyState.style.display = 'block';
          return;
        }
        emptyState.style.display = 'none';

        let html = '';
        for (const group of groups) {
          let memberCount = 0;
          let balanceText = '';
          let balanceClass = '';

          try {
            const members = await getGroupMembers(group.id);
            memberCount = members.length;
            const myMember = members.find(m => m.user_id === currentUserId);
            if (myMember) {
              const result = await calculateGroupBalances(group.id);
              const myBalance = result.balances.find(b => b.memberId === myMember.id);
              if (myBalance) {
                if (myBalance.netBalance > 0) {
                  balanceText = `You are owed $${myBalance.netBalance.toFixed(2)}`;
                  balanceClass = 'positive';
                } else if (myBalance.netBalance < 0) {
                  balanceText = `You owe $${Math.abs(myBalance.netBalance).toFixed(2)}`;
                  balanceClass = 'negative';
                } else {
                  balanceText = 'Settled up';
                }
              }
            }
          } catch {
            // fallback — just show member count, no balance
          }

          html += `
            <a href="/groups.html?id=${group.id}" class="group-card">
              <h3>${escapeHtml(group.name)}</h3>
              <div class="group-meta">${group.description ? escapeHtml(group.description) : 'No description'}</div>
              ${memberCount > 0 ? `<div class="group-meta">${memberCount} member${memberCount !== 1 ? 's' : ''}</div>` : ''}
              <div class="group-balance">
                ${balanceText ? `<span class="${balanceClass}">${balanceText}</span>` : '<span>View details</span>'}
                <span class="positive">→</span>
              </div>
            </a>
          `;
        }
        container.innerHTML = html;
      } catch (err) {
        if (loadingState) loadingState.style.display = 'none';
        container.innerHTML = `<div class="form-error">${escapeHtml(err.message || 'Error loading groups')}</div>`;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ── Create Group ──
    window.showCreateGroupModal = function() {
      document.getElementById('create-group-modal').style.display = 'flex';
    };
    window.closeCreateGroupModal = function() {
      document.getElementById('create-group-modal').style.display = 'none';
      document.getElementById('create-group-error').style.display = 'none';
    };

    document.getElementById('create-group-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('create-group-btn');
      const errorEl = document.getElementById('create-group-error');
      btn.disabled = true;
      btn.textContent = 'Creating...';
      errorEl.style.display = 'none';

      const name = document.getElementById('group-name').value;
      const description = document.getElementById('group-desc').value;

      try {
        await createGroup(name, description || undefined);
        window.closeCreateGroupModal();
        document.getElementById('create-group-form').reset();
        await loadGroups();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create group';
      }
    });

    // ── Logout ──
    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      await logOut();
      window.location.href = '/';
    });

    // ── Auth state listener ──
    onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT' && !initialAuthCheck && currentUserId) {
        window.location.href = '/';
      }
    });

    init();
  </script>
</body>
</html>
